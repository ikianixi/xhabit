name: xhabit_native
description: Headless-safe Android storage & timezone bridge plugin for XHabit.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: app.xhabit.nativebridge
        pluginClass: XHabitNativePlugin
