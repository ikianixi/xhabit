name: Build XHabit Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze code
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Build Android APK (release)
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/xhabit-release.p12"
            export XHABIT_KEYSTORE_PATH="${{ runner.temp }}/xhabit-release.p12"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set; release APK will fall back to debug signing."
          fi
          BUILD_NUM=$((GITHUB_RUN_NUMBER + 10))
          flutter build apk --release --build-number="$BUILD_NUM"

      - name: Build Android APK (PR debug smoke check)
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: xhabit-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
