name: xhabit
description: XHabit - Clean-room bilingual (Persian/English) habit tracker with dual Gregorian & Jalali calendars, home widgets, and future sync ports.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  flutter_riverpod: ^3.5.0

  # Local persistence & security
  sqflite: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  uuid: ^4.6.0

  # Dual Gregorian + Jalali (Shamsi) calendar
  shamsi_date: ^1.1.1

  # Charts, visual feedback & animations
  fl_chart: ^1.3.1
  confetti: ^0.8.0

  # Notifications, background work & Android Home Screen widgets
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2
  workmanager: ^0.10.10
  home_widget: ^0.10.0

  # Rich media notes (voice & images) & backup/export
  record: ^7.2.0
  just_audio: ^0.10.6
  image_picker: ^1.2.4
  file_picker: ^13.4.1
  share_plus: ^13.3.1
  google_sign_in: ^6.2.1
  xhabit_native:
    path: packages/xhabit_native

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
    - family: FiraSans
      fonts:
        - asset: assets/fonts/FiraSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/FiraSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/FiraSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/FiraSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/FiraSans-ExtraBold.ttf
          weight: 800
